name: Uptime

# Weekly ping of the deployed app. GitHub emails you if this fails.
# Set the repository variable APP_URL (Settings → Secrets and variables → Actions → Variables).
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.APP_URL != '' }}
    steps:
      - name: GET /api/health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 "${{ vars.APP_URL }}/api/health"
