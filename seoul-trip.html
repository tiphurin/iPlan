<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Seoul 26" />
    <meta name="theme-color" content="#00A84D" />
    <title>Seoul 22–27 ต.ค. 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f2f4f7;
        --surface: #ffffff;
        --sunk: #e9edf2;
        --ink: #14171d;
        --muted: #5a6371;
        --faint: #8a93a0;
        --line: #dde2e8;
        --l1: #0052a4;
        --l2: #00a84d;
        --l3: #ef7c1c;
        --l5: #996cac;
        --la: #0090d2;
        --lw: #9aa3ae;
        --lc: #4a5563;
        --good: #00a84d;
        --warn: #d9822b;
        --bad: #d6453d;
        --pool: #c2185b;
        --r-lg: 22px;
        --r-md: 16px;
        --r-sm: 12px;
        --head: 'Bai Jamjuree', 'IBM Plex Sans Thai', system-ui, sans-serif;
        --body: 'IBM Plex Sans Thai', -apple-system, 'Sukhumvit Set', system-ui, sans-serif;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0e1115;
          --surface: #181c22;
          --sunk: #222831;
          --ink: #eceff3;
          --muted: #a3acb8;
          --faint: #7a8492;
          --line: #2b323c;
          --l1: #3d8be0;
          --l2: #22c46a;
          --l3: #ff9640;
          --l5: #b98acb;
          --la: #2ab2ee;
          --lw: #6f7884;
          --lc: #8893a1;
          --good: #22c46a;
          --warn: #f0a04b;
          --bad: #f06a61;
          --pool: #f06292;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #0e1115;
        --surface: #181c22;
        --sunk: #222831;
        --ink: #eceff3;
        --muted: #a3acb8;
        --faint: #7a8492;
        --line: #2b323c;
        --l1: #3d8be0;
        --l2: #22c46a;
        --l3: #ff9640;
        --l5: #b98acb;
        --la: #2ab2ee;
        --lw: #6f7884;
        --lc: #8893a1;
        --good: #22c46a;
        --warn: #f0a04b;
        --bad: #f06a61;
        --pool: #f06292;
        color-scheme: dark;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        font-size: 16px;
        line-height: 1.55;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 30;
        background: var(--bg);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--la);
        outline-offset: 2px;
        border-radius: 8px;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 0 16px 130px;
      }
      .top {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        background: var(--bg);
        padding: 10px 16px 8px;
        max-width: 560px;
        margin: 0 auto;
      }
      .top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .brand {
        font-family: var(--head);
        font-weight: 700;
        font-size: 22px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 4px solid var(--l2);
        background: var(--surface);
      }
      .clocks {
        display: flex;
        gap: 6px;
      }
      .clock {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
      }
      .clock b {
        font-family: var(--head);
        color: var(--ink);
        font-weight: 600;
        font-size: 15px;
        margin-left: 4px;
      }
      .sync {
        font-size: 12px;
        color: var(--faint);
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sync i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--faint);
        display: inline-block;
      }
      .sync.on i {
        background: var(--good);
      }
      .sync.err i {
        background: var(--bad);
      }
      .nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 25;
        background: var(--surface);
        border-top: 1px solid var(--line);
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
      }
      .nav-in {
        max-width: 560px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
      }
      .nav button {
        background: none;
        border: 0;
        padding: 6px 2px;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-size: 12px;
        color: var(--faint);
        min-height: 52px;
      }
      .nav button svg {
        width: 25px;
        height: 25px;
      }
      .nav button[aria-current='page'] {
        color: var(--ink);
      }
      .nav button[aria-current='page'] svg {
        color: var(--l2);
      }
      h2 {
        font-family: var(--head);
        font-weight: 700;
        font-size: 24px;
        line-height: 1.2;
        margin: 18px 0 10px;
      }
      h3 {
        font-family: var(--head);
        font-weight: 600;
        font-size: 18px;
        line-height: 1.3;
        margin: 0 0 4px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 14px;
      }
      .tiny {
        font-size: 12px;
        color: var(--faint);
      }
      .num {
        font-family: var(--head);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        padding: 14px 16px;
        margin: 10px 0;
      }
      .hero {
        border-radius: var(--r-lg);
        padding: 18px;
        margin: 12px 0;
        color: #fff;
        position: relative;
        overflow: hidden;
      }
      .hero .k {
        font-size: 14px;
        opacity: 0.92;
      }
      .hero .big {
        font-family: var(--head);
        font-weight: 700;
        font-size: 32px;
        line-height: 1.12;
        margin: 4px 0;
      }
      .hero .sub {
        font-size: 15px;
        opacity: 0.95;
      }
      .hero.g {
        background: var(--l2);
      }
      .hero.b {
        background: var(--la);
      }
      .hero.p {
        background: var(--l5);
      }
      .hero.o {
        background: var(--l3);
      }
      .hero.ink {
        background: #1f2a37;
      }
      .hero.blue {
        background: var(--l1);
      }
      .hero .ring {
        position: absolute;
        right: -34px;
        top: -34px;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 18px solid rgba(255, 255, 255, 0.18);
      }
      .between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        padding: 12px 14px;
        text-align: left;
      }
      .stat .v {
        font-family: var(--head);
        font-weight: 700;
        font-size: 20px;
        line-height: 1.2;
      }
      .stat .l {
        font-size: 13px;
        color: var(--muted);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 14px;
        font-weight: 600;
      }
      .pill.late {
        background: color-mix(in srgb, var(--bad) 16%, transparent);
        color: var(--bad);
      }
      .pill.ok {
        background: color-mix(in srgb, var(--good) 16%, transparent);
        color: var(--good);
      }
      .pill.early {
        background: color-mix(in srgb, var(--la) 16%, transparent);
        color: var(--la);
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 999px;
        padding: 9px 15px;
        font-size: 15px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-decoration: none;
        min-height: 44px;
        font-weight: 500;
      }
      .btn.solid {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .btn.green {
        background: var(--l2);
        color: #fff;
        border-color: var(--l2);
      }
      .btn.danger {
        color: var(--bad);
      }
      .btn.block {
        width: 100%;
        padding: 13px;
        font-size: 16px;
        font-weight: 600;
        border-radius: var(--r-md);
      }
      .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 12px;
      }
      .actions .btn {
        padding: 8px 6px;
        font-size: 14px;
        border-radius: var(--r-sm);
      }
      .fab {
        position: fixed;
        right: max(16px, calc(50% - 264px));
        bottom: calc(84px + env(safe-area-inset-bottom, 0px));
        z-index: 24;
        background: var(--l2);
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 15px 22px;
        font-weight: 600;
        font-size: 16px;
        box-shadow: 0 6px 18px rgba(0, 168, 77, 0.35);
      }
      .days {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        margin: 6px -16px 12px;
        padding: 0 16px 4px;
        scrollbar-width: none;
      }
      .day {
        flex: none;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: var(--r-sm);
        padding: 8px 12px;
        text-align: center;
        min-width: 66px;
      }
      .day b {
        display: block;
        font-family: var(--head);
        font-size: 17px;
      }
      .day span {
        font-size: 12px;
        color: var(--muted);
      }
      .day[aria-pressed='true'] {
        background: var(--dc);
        border-color: var(--dc);
        color: #fff;
      }
      .day[aria-pressed='true'] span {
        color: #fff;
      }
      .it {
        display: grid;
        grid-template-columns: 50px 26px 1fr;
        column-gap: 8px;
      }
      .it .t {
        font-family: var(--head);
        font-weight: 600;
        font-size: 15px;
        text-align: right;
        padding-top: 12px;
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
      }
      .it .t small {
        display: block;
        font-family: var(--body);
        font-weight: 400;
        font-size: 11px;
        color: var(--faint);
      }
      .it .rail {
        position: relative;
      }
      .it .rail::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 6px;
        margin-left: -3px;
        background: var(--rc, var(--lw));
      }
      .it.walk .rail::before {
        background: none;
        border-left: 3px dotted var(--lw);
        width: 0;
        margin-left: -1.5px;
      }
      .it .node {
        position: absolute;
        left: 50%;
        top: 13px;
        width: 22px;
        height: 22px;
        margin-left: -11px;
        border-radius: 50%;
        background: var(--surface);
        border: 5px solid var(--dc);
      }
      .it.minor .node {
        width: 14px;
        height: 14px;
        margin-left: -7px;
        top: 17px;
        border-width: 3px;
        border-color: var(--rc, var(--lw));
      }
      .it.done .node {
        background: var(--dc);
      }
      .it.skip .node {
        border-color: var(--lw);
        background: var(--sunk);
      }
      .it.now .node {
        box-shadow: 0 0 0 6px color-mix(in srgb, var(--dc) 28%, transparent);
      }
      @media (prefers-reduced-motion: no-preference) {
        .it.now .node {
          animation: pulse 1.8s ease-in-out infinite;
        }
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 10px color-mix(in srgb, var(--dc) 10%, transparent);
        }
      }
      .pc {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        margin: 6px 0;
        overflow: hidden;
      }
      .it.now .pc {
        border: 2px solid var(--dc);
      }
      .it.skip .pc {
        opacity: 0.6;
      }
      .cover {
        height: 118px;
        position: relative;
        display: flex;
        align-items: flex-end;
        padding: 12px 14px;
        color: #fff;
        background: var(--cc, var(--l2));
        overflow: hidden;
      }
      .cover img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cover .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(transparent 40%, rgba(0, 0, 0, 0.55));
      }
      .cover .kr {
        position: relative;
        font-family: var(--head);
        font-weight: 700;
        font-size: 24px;
        line-height: 1.1;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.25);
      }
      .cover .deco {
        position: absolute;
        right: -20px;
        top: -26px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 16px solid rgba(255, 255, 255, 0.2);
      }
      .cover .deco2 {
        position: absolute;
        right: 56px;
        top: 40px;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 8px solid rgba(255, 255, 255, 0.16);
      }
      .cover .cnt {
        position: absolute;
        right: 10px;
        bottom: 10px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 999px;
        font-size: 12px;
        padding: 2px 8px;
      }
      .pc .in {
        padding: 12px 14px;
      }
      .pc p {
        margin: 4px 0 0;
        font-size: 14px;
        color: var(--muted);
      }
      .det {
        font-size: 13px;
        color: var(--muted);
        margin-top: 8px;
        display: grid;
        gap: 2px;
      }
      .det a {
        color: var(--la);
        text-decoration: none;
      }
      .thumbs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        margin-top: 10px;
      }
      .thumbs button {
        flex: none;
        border: 0;
        padding: 0;
        border-radius: 10px;
        overflow: hidden;
        width: 64px;
        height: 64px;
        background: var(--sunk);
      }
      .thumbs img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .mvrow {
        background: none;
        border: 0;
        width: 100%;
        text-align: left;
        font-size: 14px;
        color: var(--muted);
        padding: 8px 0;
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .taskrow {
        background: var(--surface);
        border: 1px dashed var(--line);
        border-radius: var(--r-sm);
        padding: 9px 12px;
        margin: 6px 0;
        width: 100%;
        text-align: left;
        font-size: 14px;
      }
      .taskrow b {
        font-weight: 600;
      }
      .lb {
        flex: none;
        min-width: 24px;
        height: 24px;
        border-radius: 999px;
        color: #fff;
        font-family: var(--head);
        font-weight: 700;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 6px;
      }
      .tag {
        display: inline-block;
        font-size: 12px;
        border-radius: 999px;
        padding: 1px 8px;
        margin: 6px 4px 0 0;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .tag.fix {
        background: var(--l3);
        border-color: var(--l3);
        color: #fff;
      }
      .tag.ver {
        border-color: var(--warn);
        color: var(--warn);
      }
      .tag.ok {
        border-color: var(--good);
        color: var(--good);
      }
      .tag.opt {
        border-style: dashed;
      }
      .tag.tz {
        border-color: var(--l1);
        color: var(--l1);
      }
      .money-line {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
      }
      .done-line {
        font-size: 13px;
        color: var(--good);
        margin-top: 6px;
      }
      .list {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        overflow: hidden;
        margin: 10px 0;
      }
      .li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border: 0;
        border-top: 1px solid var(--line);
        background: none;
        width: 100%;
        text-align: left;
        min-height: 52px;
      }
      .li:first-child {
        border-top: 0;
      }
      .li .grow {
        flex: 1;
        min-width: 0;
      }
      .li .ttl {
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .li .meta {
        font-size: 12px;
        color: var(--faint);
        display: block;
      }
      .amt {
        text-align: right;
        white-space: nowrap;
      }
      .amt b {
        display: block;
        font-family: var(--head);
        font-weight: 600;
      }
      .amt span {
        font-size: 12px;
        color: var(--faint);
      }
      .cat {
        width: 34px;
        height: 34px;
        flex: none;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        font-family: var(--head);
      }
      .chk {
        width: 30px;
        height: 30px;
        flex: none;
        border-radius: 9px;
        border: 2px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface);
      }
      .chk.on {
        background: var(--l2);
        border-color: var(--l2);
      }
      .chk svg {
        width: 18px;
        height: 18px;
        color: #fff;
        opacity: 0;
      }
      .chk.on svg {
        opacity: 1;
      }
      .li.done .ttl {
        text-decoration: line-through;
        color: var(--faint);
      }
      .icon-btn {
        background: none;
        border: 0;
        color: var(--faint);
        padding: 8px;
        border-radius: 10px;
        min-width: 40px;
        min-height: 40px;
        font-size: 15px;
      }
      .bar {
        height: 9px;
        background: var(--sunk);
        border-radius: 99px;
        overflow: hidden;
        margin-top: 6px;
        display: flex;
      }
      .bar i {
        display: block;
        height: 100%;
      }
      .bar.over {
        outline: 2px solid var(--bad);
      }
      .group-h {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 20px 2px 0;
        gap: 8px;
      }
      .group-h h3 {
        margin: 0;
      }
      .settle {
        border-radius: var(--r-md);
        padding: 14px 16px;
        background: var(--sunk);
        margin: 10px 0;
      }
      .av {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 600;
        font-size: 13px;
        flex: none;
      }
      .av.A {
        background: var(--l1);
      }
      .av.B {

          .map(Number)
        return Date.UTC(y, mo - 1, d, h - off(tz), mi)

      function LocalStore() {
        const subs = {}
        const read = (c) => LS.get('db.' + c, {})
        const arr = (o) => Object.entries(o).map(([id, v]) => ({ id, ...v }))
        return {
          kind: 'local',
          subscribe(c, cb) {
            ;(subs[c] = subs[c] || []).push(cb)
            cb(arr(read(c)))
            return () => {}
          },
          async set(c, id, data) {
            const o = read(c)
            o[id] = data
            if (!LS.set('db.' + c, o)) throw { code: 'quota' }
            ;(subs[c] || []).forEach((f) => f(arr(o)))
          },
          async del(c, id) {
            const o = read(c)
            delete o[id]
            LS.set('db.' + c, o)
            ;(subs[c] || []).forEach((f) => f(arr(o)))
          },
        }
      }
      function RemoteStore(kind, colRef) {
        return {
          kind,
          subscribe(c, cb) {
            return colRef(c).onSnapshot(
              (s) => cb(s.docs.map((d) => ({ id: d.id, ...d.data() }))),
              () => {
                syncState.err = true
                renderTop()
              },
            )
          },
          set: (c, id, data) => colRef(c).doc(id).set(data),
          del: (c, id) => colRef(c).doc(id).delete(),
        }
      }
      function apply(c, rows) {
        if (c === 'meta') S.meta = rows.find((r) => r.id === 'settings') || {}
        else if (MAPCOLS.includes(c)) S[c] = Object.fromEntries(rows.map((r) => [r.id, r]))
        else S[c] = rows
      }
      function connect(st) {
        unsubs.forEach((u) => {
          try {
            u()
          } catch (e) {}
        })
        store = st
        syncState = { kind: st.kind, err: false }
        unsubs = COLS.map((c) =>
          st.subscribe(c, (rows) => {
            apply(c, rows)
            scheduleRender()

        renderTop()

      function planAll() {

          if (d.deleted) delete map[d.id]

        const arr = Object.values(map)
          .filter((p) => DAYS[p.day])
          .map((p) => {

              date = DAYS[p.day].date
            const ms = msAt(date, p.t, tz)
            return { ...p, tz, ms }
          })
          .sort((a, b) => a.ms - b.ms || (a.kind === 'move') - (b.kind === 'move'))
        arr.forEach((p, i) => {
          let e = null
          if (p.end) {
            e = msAt(DAYS[p.day].date, p.end, p.tz)
            if (e <= p.ms) e += 864e5
          } else {
            const nx = arr[i + 1]
            e = nx ? Math.min(nx.ms, p.ms + 60 * 60e3) : p.ms + 60 * 60e3
            if (e <= p.ms) e = p.ms + 15 * 60e3
          }
          p.endMs = e
        })
        return arr
      }

      /* ================= MONEY ================= */
      const W = (k) => (k < 0 ? '−' : '') + '₩' + Math.abs(Math.round(k)).toLocaleString('en-US')
      const B = (k) =>
        (k < 0 ? '−' : '') + '฿' + Math.abs(Math.round((k * rate()) / 1000)).toLocaleString('en-US')
      function shares(e) {
        const k = Number(e.krw) || 0
        const a =
          e.split === 'A'
            ? k
            : e.split === 'B'
              ? 0
              : e.split === 'custom'
                ? Math.min(k, Math.max(0, Number(e.shareA) || 0))
                : k / 2
        return { A: a, B: k - a }
      }
      function calc() {
        const P = { A: { paid: 0, contrib: 0, share: 0 }, B: { paid: 0, contrib: 0, share: 0 } }
        let poolSpent = 0,
          total = 0
        const byDay = {},
          byCat = {},
          byItem = {}
        for (const e of S.expenses) {
          const k = Number(e.krw) || 0
          total += k
          if (e.payer === 'POOL') poolSpent += k
          else if (P[e.payer]) P[e.payer].paid += k
          const s = shares(e)
          P.A.share += s.A
          P.B.share += s.B
          const d = (byDay[e.day || 0] = byDay[e.day || 0] || { A: 0, B: 0, t: 0 })
          d.A += s.A
          d.B += s.B
          d.t += k
          byCat[e.cat] = (byCat[e.cat] || 0) + k
          if (e.item) byItem[e.item] = (byItem[e.item] || 0) + k
        }
        for (const p of S.pool) if (P[p.who]) P[p.who].contrib += Number(p.krw) || 0
        const tc = P.A.contrib + P.B.contrib,
          left = tc - poolSpent
        const refA = tc > 0 ? (left * P.A.contrib) / tc : left / 2,
          refB = left - refA
        const netA = P.A.paid + P.A.contrib - P.A.share - refA
        return { P, poolSpent, total, tc, left, refA, refB, netA, byDay, byCat, byItem }
      }

      async function saveFile(filename, text, mime) {

      function moveRow(p) {
        const line = p.l || 'W'
        return `<button class="mvrow" data-act="edititem" data-id="${p.id}">${line === 'W' ? '' : `<span class="lb" style="background:var(${LINES[line] || '--lw'})">${line === 'car' ? 'รถ' : line}</span>`}<span><span style="color:var(--ink)">${esc(p.title)}</span>${p.desc ? `<br><span class="tiny">${esc(p.desc)}</span>` : ''}${p.tz !== DAYS[p.day].tz ? ' <span class="tag tz">เวลาไทย</span>' : ''}</span></button>`
      }
      function taskRow(p) {
        const icon = { wake: 'ตื่น', sleep: 'นอน', task: 'ทำ', flight: 'บิน' }[p.kind] || ''
        const st = S.stops[p.id] || {}
        return `<button class="taskrow" data-act="edititem" data-id="${p.id}"><b>${icon ? icon + ': ' : ''}${esc(p.title)}</b>${st.status === 'done' ? ' <span class="tiny" style="color:var(--good)">เสร็จ ' + esc(st.at || '') + '</span>' : ''}${p.desc ? `<br><span class="tiny">${esc(p.desc)}</span>` : ''}${p.tz !== DAYS[p.day].tz ? ' <span class="tag tz">เวลาไทย</span>' : ''}</button>`
      }

      /* ================= TODAY ================= */
      function renderToday() {
        const t = now(),
          items = planAll(),
          c = calc(),
          n = names()
        let h = ''
        if (t < TRIP_LIVE) {
          const bkk =
            items.find((p) => p.id === 'd0-bkk') || items.find((p) => p.day === 0) || items[0]
          const pre = checkAll().filter((x) =>
            ['docs', 'book', 'money', 'pack', 'clothes'].includes(x.g),
          )
          const dn = pre.filter((x) => S.checks[x.id] && S.checks[x.id].done).length
          const todo = pre.filter((x) => !(S.checks[x.id] && S.checks[x.id].done)).slice(0, 5)
          h += `<div class="hero g"><div class="ring"></div><div class="k">อีกนานแค่ไหนถึงเวลาเช็กอินที่สุวรรณภูมิ</div><div class="big">${fmtDur(bkk.ms - t)}</div><div class="sub">พฤ. 22 ต.ค. ${bkk.t} น. บิน VZ850 ตี 2:25</div></div>
      <div class="card"><div class="between"><h3>เตรียมตัวก่อนบิน</h3><span class="num">${dn}/${pre.length}</span></div><div class="bar"><i style="width:${pre.length ? (dn / pre.length) * 100 : 0}%;background:var(--l2)"></i></div>
      ${todo.length ? `<div class="list">${todo.map((x) => checkRow(x)).join('')}</div>` : '<div class="tiny" style="margin-top:8px">เตรียมครบแล้ว</div>'}
      <div class="btns"><button class="btn" data-tab="check">ดูเช็กลิสต์ทั้งหมด</button><button class="btn" data-act="calsheet">ลงปฏิทิน</button></div></div>
      <h2>แผน 6 วัน</h2>${DAYS.map((d) => `<button class="li card" style="margin:8px 0" data-goday="${d.n}"><span class="lb" style="background:var(${d.color})">${d.n === 0 ? 'เตรียม' : d.n === 5 ? 'กลับ' : 'D' + d.n}</span><span class="grow"><span class="ttl">${esc(d.title)}</span><span class="meta">${d.label} ต.ค. ${items.filter((p) => p.day === d.n && p.kind === 'place').length} สถานที่</span></span></button>`).join('')}`
        } else if (t > TRIP_END) {
          h += `<div class="hero ink"><div class="ring"></div><div class="k">จบทริปแล้ว ใช้ไปทั้งหมด</div><div class="big">${W(c.total)}</div><div class="sub">≈ ${B(c.total)}</div></div>${settleBox(c)}`
        } else {
          const act = [...items].reverse().find((p) => p.ms <= t) || items[0]
          const cur = [...items].reverse().find((p) => p.ms <= t && p.kind !== 'move')
          const next = items.find((p) => p.ms > t)
          const nextMain = items.find((p) => p.ms > t && p.kind !== 'move')
          const { delay } = statusInfo(t, items)
          const dn = act.day,
            day = DAYS[dn]
          const heroCls =
            { '--l2': 'g', '--l3': 'o', '--l5': 'p', '--la': 'b', '--lc': 'ink' }[day.color] || 'g'
          const span = Math.max(60e3, act.endMs - act.ms),
            el = Math.min(span, Math.max(0, t - act.ms)),
            over = t > act.endMs
          const stA = S.stops[act.id] || {}
          h += `<div class="hero ${heroCls}"><div class="ring"></div><div class="k">${dn === 0 ? 'วันเดินทาง' : 'D' + dn} ${act.kind === 'move' ? 'กำลังเดินทาง' : over ? 'เลยเวลาของจุดนี้แล้ว' : 'ตอนนี้'}</div>
      <div class="big">${esc(act.title)}</div><div class="sub">${act.t}–${hmOf(act.endMs, act.tz)}${act.tz !== day.tz ? ' เวลาไทย' : ''}</div>
      <div class="hbar" role="progressbar" aria-valuenow="${Math.round((el / span) * 100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${(el / span) * 100}%"></i></div>
      <div class="between" style="font-size:14px"><span>ผ่านไป ${fmtDur(el)}</span><span>${over ? 'เกินมา ' + fmtDur(t - act.endMs) : 'เหลือ ' + fmtDur(act.endMs - t)}</span></div>
      ${act.kind !== 'move' && !stA.status ? `<button class="btn hbtn" data-act="quickdone" data-id="${act.id}">ถึงแล้ว เช็กอินตอนนี้</button>` : stA.status === 'done' ? `<div class="sub" style="margin-top:8px">เช็กอินแล้ว ${esc(stA.at)}</div>` : ''}</div>`
          h += `<div class="card"><div class="between"><span class="small muted">เทียบกับแพลน</span>${delayPill(delay)}</div>
      ${next ? `<div class="countdown"><div><div class="tiny">ต่อไป ${next.t}${next.tz !== DAYS[next.day].tz ? ' (เวลาไทย)' : ''}</div><div class="nt">${esc(next.title)}</div></div><div class="cd"><span class="tiny">อีก</span><b class="num">${fmtDur(next.ms - t)}</b></div></div>` : ''}
      ${delay != null && delay > 5 && next ? `<div class="tiny" style="margin-top:6px">ถ้ายังช้าอยู่ ${fmtDur(delay * 60e3)} จะเริ่ม "${esc(next.title)}" ราว ${hmOf(next.ms + delay * 60e3, next.tz)}</div>` : ''}
      ${delay != null && delay > 10 && nextMain ? `<div class="note">ลองตัดเวลาที่จุดนี้ หรือข้ามจุดที่มีป้าย "ไม่บังคับ" เพื่อให้ทัน ${esc(nextMain.title)}</div>` : ''}
      ${delay == null ? '<div class="tiny" style="margin-top:6px">กด "เช็กอิน" เมื่อถึงแต่ละที่ แอปจะบอกว่าช้าหรือเร็วกว่าแพลนกี่นาที</div>' : ''}</div>`
          const todays = items.filter((p) => p.day === dn && p.kind !== 'move')
          const doneN = todays.filter((p) => S.stops[p.id] && S.stops[p.id].status).length,
            passed = todays.filter((p) => p.ms <= t).length
          h += `<div class="card"><div class="between"><h3>ความคืบหน้า${dn === 0 ? 'วันเดินทาง' : ' D' + dn}</h3><span class="num small">${doneN}/${todays.length}</span></div>
      <div class="bar" style="position:relative"><i style="width:${todays.length ? (doneN / todays.length) * 100 : 0}%;background:var(--l2)"></i></div>
      <div class="tiny" style="margin-top:4px">เช็กอินแล้ว ${doneN} จุด ตามเวลาควรถึงแล้ว ${passed} จุด${passed > doneN ? `, ยังไม่ได้เช็กอิน ${passed - doneN} จุด` : ''}</div>
      <div class="list">${items
        .filter((p) => p.ms > t)
        .slice(0, 5)
        .map(
          (p) =>
            `<button class="li" data-goday="${p.day}"><span class="num" style="width:46px">${p.t}</span><span class="grow"><span class="ttl">${esc(p.title)}</span><span class="meta">อีก ${fmtDur(p.ms - t)}</span></span></button>`,
        )
        .join('')}</div></div>`
          if (act.kind === 'place') h += placeCard(act, c)
          if (nextMain && nextMain.kind === 'place' && nextMain !== act)
            h +=
              `<div class="group-h"><h3>จุดถัดไป</h3><span class="tiny">${nextMain.t}</span></div>` +
              placeCard(nextMain, c)
          h += sleepCard(t, items)
          if (dn >= 1 && dn <= 4) {
            const bd = c.byDay[dn] || { A: 0, B: 0 },
              bud = BUDGET[dn][1]
            h += `<div class="group-h"><h3>เงินวันนี้ (ต่อคน)</h3><button class="btn" data-tab="money">ดูทั้งหมด</button></div><div class="grid2">${['A', 'B'].map((p) => `<div class="stat"><div class="l">${esc(n[p])}</div><div class="v">${W(bd[p])}</div><div class="tiny">≈ ${B(bd[p])} งบ ${W(bud)}</div><div class="bar ${bd[p] > bud ? 'over' : ''}"><i style="width:${Math.min(100, (bd[p] / bud) * 100)}%;background:var(${p === 'A' ? '--l1' : '--l3'})"></i></div></div>`).join('')}</div>`
          }
          if (dn === 4) {
            const low = ['A', 'B'].filter(
              (p) => (Number((S.wallet['tmoney_' + p] || {}).bal) || 0) < 5000,
            )
            if (low.length)
              h += `<div class="note">T-money ของ ${low.map((p) => esc(n[p])).join(' และ ')} เหลือไม่ถึง ₩5,000 (≈ ${B(5000)}) เติมก่อนขึ้นรถไฟไปสนามบิน</div>`
          }
        }
        h += simCard()
        return h
      }
      function sleepCard(t, items) {
        const n = names(),
          nd = nightDate(t)
        const nextWake = items.find((p) => p.kind === 'wake' && p.ms > t - 3 * 3600e3)
        const lastSleepPlan = [...items]
          .reverse()
          .find((p) => p.kind === 'sleep' && p.ms <= t + 4 * 3600e3)
        const rows = ['A', 'B']
          .map((p) => {
            const rec = S.sleep[sleepKey(nd, p)] || {}
            let txt = 'ยังไม่บันทึก'
            if (rec.bed && rec.wake)
              txt = `นอน ${hmOf(rec.bed, 'KR')} ตื่น ${hmOf(rec.wake, 'KR')} (${fmtDur(rec.wake - rec.bed)})`
            else if (rec.bed)
              txt = `เข้านอน ${hmOf(rec.bed, 'KR')}${nextWake ? `, นอนได้อีก ${fmtDur(nextWake.ms - Math.max(t, rec.bed))}` : ''}`
            else if (rec.wake) txt = `ตื่น ${hmOf(rec.wake, 'KR')}`
            let late = ''
            if (rec.wake && nextWake && Math.abs(rec.wake - nextWake.ms) < 6 * 3600e3) {
              const d = Math.round((rec.wake - nextWake.ms) / 60e3)
              late =
                d > 5
                  ? ` <span class="pill late" style="font-size:12px;padding:1px 8px">ตื่นช้า ${d} นาที</span>`
                  : ' <span class="pill ok" style="font-size:12px;padding:1px 8px">ทันแพลน</span>'
            }
            return `<div class="between small" style="margin-top:6px"><span><span class="av ${p}" style="width:22px;height:22px;font-size:11px">${esc(n[p].slice(0, 1))}</span> ${esc(n[p])}</span><span class="muted">${txt}${late}</span></div>`
          })
          .join('')
        return `<div class="card"><div class="between"><h3>นอนและตื่น</h3><span class="tiny">${nextWake ? `ต้องตื่น ${nextWake.t} (${DAYS[nextWake.day].label})` : ''}</span></div>
    ${lastSleepPlan ? `<div class="tiny">แผนเข้านอน ${lastSleepPlan.t}${nextWake ? `, ถ้านอนตอนนี้จะได้ ${fmtDur(nextWake.ms - t)}` : ''}</div>` : ''}
    ${rows}<div class="sleep-btns"><button class="btn" data-act="bed">เข้านอนแล้ว (${esc(n[me])})</button><button class="btn green" data-act="wake">ตื่นแล้ว (${esc(n[me])})</button></div></div>`
      }

      /* ================= PLAN ================= */
      function renderPlan() {
        const t = now(),
          items = planAll(),
          c = calc()
        const cur = [...items].reverse().find((p) => p.ms <= t && t < p.endMs && p.kind !== 'move')
        const d = DAYS[planDay] || DAYS[1]
        const list = items.filter((p) => p.day === d.n)
        const spentDay = list.reduce((a, p) => a + (c.byItem[p.id] || 0), 0),
          budDay = list.reduce((a, p) => a + (Number(p.budget) || 0), 0)
        let h = `<h2>แผนเที่ยว</h2><div class="days">${DAYS.map((x) => `<button class="day" style="--dc:var(${x.color})" data-day="${x.n}" aria-pressed="${x.n === d.n}"><b>${x.n === 0 ? 'เตรียม' : x.n === 5 ? 'กลับ' : 'D' + x.n}</b><span>${x.label}</span></button>`).join('')}</div>
    <div class="card"><h3>${esc(d.title)}</h3><div class="tiny">${d.label} ต.ค. 2026 เวลา${d.tz === 'TH' ? 'ไทย' : 'เกาหลี'}${budDay ? `, งบในแผน ${W(budDay)} ≈ ${B(budDay)}` : ''}${spentDay ? `, ใช้จริง ${W(spentDay)}` : ''}</div>
    <div class="btns"><button class="btn green" data-act="newitem" data-day="${d.n}">+ เพิ่มรายการ</button>${cur && cur.day === d.n ? '<button class="btn" data-act="gonow">ไปที่ตอนนี้</button>' : ''}<button class="btn" data-act="calsheet" data-day="${d.n}">ลงปฏิทินทั้งวัน</button></div></div>
    <div style="--dc:var(${d.color})">`
        if (!list.length)
          h += `<div class="card empty">วันนี้ยังไม่มีรายการ กด "+ เพิ่มรายการ" เพื่อเริ่ม</div>`
        list.forEach((p, i) => {
          const st = S.stops[p.id] || {}
          const rc =
            p.kind === 'move'
              ? LINES[p.l] || '--lw'
              : list[i + 1] && list[i + 1].kind === 'move'
                ? LINES[list[i + 1].l] || '--lw'
                : '--lw'
          const minor = p.kind !== 'place'
          const cls = [
            'it',
            p.kind === 'move' && (p.l || 'W') === 'W' ? 'walk' : '',
            minor ? 'minor' : '',
            st.status === 'done' ? 'done' : '',
            st.status === 'skip' ? 'skip' : '',
            cur && cur.id === p.id ? 'now' : '',
          ].join(' ')
          const body =
            p.kind === 'place' ? placeCard(p, c) : p.kind === 'move' ? moveRow(p) : taskRow(p)
          h += `<div class="${cls}" style="--rc:var(${rc})"><div class="t">${p.t}${p.end && p.kind === 'place' ? `<small>${p.end}</small>` : ''}${p.tz !== d.tz ? '<small>ไทย</small>' : ''}</div><div class="rail">${p.kind === 'move' ? '' : '<span class="node"></span>'}</div><div>${body}</div></div>`
        })
        h += `</div><button class="btn block green" style="margin-top:12px" data-act="newitem" data-day="${d.n}">+ เพิ่มรายการใน${d.n === 0 ? 'วันเตรียมตัว' : ' D' + d.n}</button>
    <div class="note">กดที่รายการเดินทางหรือสิ่งที่ต้องทำเพื่อแก้ไข เวลาเรียงอัตโนมัติ ถ้าแก้เวลาแล้วรายการจะย้ายตำแหน่งเอง</div>`
        return h
      }

      /* ================= MONEY ================= */
      function settleBox(c) {
        const n = names(),
          diff = Math.round(c.netA)
        let line = 'ตอนนี้ไม่มีใครติดเงินใคร'
        if (diff > 0)
          line = `${esc(n.B)} โอนให้ ${esc(n.A)} <span class="num">${W(diff)}</span> <span class="muted small">≈ ${B(diff)}</span>`
        if (diff < 0)
          line = `${esc(n.A)} โอนให้ ${esc(n.B)} <span class="num">${W(-diff)}</span> <span class="muted small">≈ ${B(-diff)}</span>`
        const refund =
          c.tc > 0 && Math.round(c.left) !== 0
            ? `<div class="tiny" style="margin-top:6px">คิดรวมการคืนเงินกองกลางที่เหลือ ${W(c.left)} ตามสัดส่วนที่ลง: ${esc(n.A)} ${W(c.refA)}, ${esc(n.B)} ${W(c.refB)}</div>`
            : ''
        return `<div class="settle"><div class="small muted">ใครติดเงินใคร</div><div style="margin-top:4px;font-size:17px">${line}</div>${refund}<div class="tiny" style="margin-top:6px">ไม่ได้หารสองทั้งหมด คิดจากแต่ละรายการว่าใครจ่ายและเป็นส่วนของใคร</div></div>`
      }
      function donut(segs, total) {
        const R = 52,
          L = 2 * Math.PI * R
        let acc = 0
        const circles =
          total > 0
            ? segs
                .map((s) => {
                  const len = (s.v / total) * L
                  const el = `<circle r="${R}" cx="65" cy="65" fill="none" stroke="var(${s.c})" stroke-width="18" stroke-dasharray="${len} ${L - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 65 65)"/>`
                  acc += len
                  return el
                })
                .join('')
            : ''
        return `<svg viewBox="0 0 130 130" width="130" height="130" role="img" aria-label="สัดส่วนค่าใช้จ่ายตามหมวด"><circle r="${R}" cx="65" cy="65" fill="none" stroke="var(--sunk)" stroke-width="18"/>${circles}<text x="65" y="62" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--body)">รวม</text><text x="65" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" font-family="var(--head)">${total >= 1e6 ? (total / 1e6).toFixed(1) + 'M' : Math.round(total / 1000) + 'k'}</text></svg>`
      }
      function expRow(e) {
        const cat = CATS.find((x) => x.id === e.cat) || CATS[6],
          n = names(),
          s = shares(e)
        const it = e.item ? planAll().find((p) => p.id === e.item) : null
        const splitTxt =
          e.split === 'A'
            ? 'ของ ' + n.A
            : e.split === 'B'
              ? 'ของ ' + n.B
              : e.split === 'custom'
                ? `${n.A} ${W(s.A)}, ${n.B} ${W(s.B)}`
                : 'หารครึ่ง'
        return `<button class="li" data-act="editexp" data-id="${e.id}"><span class="cat" style="background:var(${cat.c})">${cat.name.slice(0, 2)}</span><span class="grow"><span class="ttl">${esc(e.title || (it ? it.title : cat.name))}</span><span class="meta">${esc(n[e.payer] || '')} จ่าย${e.method ? ' ด้วย ' + esc(e.method) : ''}, ${esc(splitTxt)}${it && e.title ? ', ' + esc(it.title) : ''}${e.cur === 'THB' ? `, จ่าย ฿${Number(e.amt).toLocaleString('en-US')}` : ''}</span></span><span class="amt"><b>${W(e.krw)}</b><span>≈ ${B(e.krw)}</span></span></button>`
      }
      function renderMoney() {
        const c = calc(),
          n = names(),
          items = planAll()
        const cats = CATS.filter((x) => c.byCat[x.id]).map((x) => ({ ...x, v: c.byCat[x.id] }))
        let h = `<h2>เงิน</h2><div class="hero b"><div class="ring"></div><div class="k">ใช้ไปทั้งหมด 2 คน</div><div class="big">${W(c.total)}</div><div class="sub">≈ ${B(c.total)} เรต ₩1,000 = ฿${rate()}</div></div>${settleBox(c)}
  <div class="grid2">${['A', 'B'].map((p) => `<div class="stat"><div class="row"><span class="av ${p}">${esc(n[p].slice(0, 1))}</span><span class="l">${esc(n[p])}</span></div><div class="v" style="margin-top:6px">${W(c.P[p].share)}</div><div class="tiny">ส่วนที่ใช้จริง ≈ ${B(c.P[p].share)}</div><div class="tiny">ควักจ่าย ${W(c.P[p].paid)}, ลงกองกลาง ${W(c.P[p].contrib)}</div></div>`).join('')}</div>`
        h += `<div class="group-h"><h3>ใช้ไปกับอะไร</h3></div><div class="card">${cats.length ? `<div class="chartwrap">${donut(cats, c.total)}<div class="legend">${cats.map((x) => `<div class="between"><span><span class="sw" style="background:var(${x.c})"></span>${x.name}</span><span class="num small">${Math.round((x.v / c.total) * 100)}%</span></div>`).join('')}</div></div>` : '<div class="empty">ยังไม่มีรายการ กราฟจะขึ้นเมื่อเริ่มบันทึก</div>'}</div>`
        const maxDay = Math.max(
          1,
          ...[1, 2, 3, 4].map((d) => Math.max(BUDGET[d][1] * 2, (c.byDay[d] || { t: 0 }).t)),
        )
        h += `<div class="group-h"><h3>รายวันเทียบงบ</h3><span class="tiny"><span class="sw" style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--l1)"></span> ${esc(n.A)} <span class="sw" style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--l3);margin-left:6px"></span> ${esc(n.B)}</span></div><div class="card">${[
          0, 1, 2, 3, 4,
        ]
          .map((d) => {
            const bd = c.byDay[d] || { A: 0, B: 0, t: 0 }
            const bud = BUDGET[d] ? BUDGET[d][1] * 2 : 0
            if (!bd.t && !bud) return ''

      let photoTarget = null

        const f = ev.target.files[0]
        ev.target.value = ''
        if (!f || !photoTarget) return
        toast('กำลังย่อรูป...')
        try {
          const url = await new Promise((res, rej) => {
            const r = new FileReader()
            r.onload = () => res(r.result)
            r.onerror = rej
            r.readAsDataURL(f)
          })
          const img = await new Promise((res, rej) => {
            const i = new Image()
            i.onload = () => res(i)
            i.onerror = rej
            i.src = url
          })
          let max = 1000,
            q = 0.72,
            data = ''
          for (let k = 0; k < 7; k++) {
            const s = Math.min(1, max / Math.max(img.width, img.height))
            const cv = document.createElement('canvas')
            cv.width = Math.round(img.width * s)
            cv.height = Math.round(img.height * s)
            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height)
            data = cv.toDataURL('image/jpeg', q)
            if (data.length < 180000) break
            max = Math.round(max * 0.82)
            q = Math.max(0.5, q - 0.06)
          }
          if (await put('photos', uid(), { item: photoTarget, data, ts: Date.now(), by: me }))
            toast('เพิ่มรูปแล้ว')

          toast('เปิดรูปนี้ไม่ได้')

      })

      function firebaseSheet() {
        const fb = LS.get('fb', null) || {}
        openSheet(
          `<h3>ตั้งค่า Firebase</h3><ol class="small" style="padding-left:20px;margin:6px 0"><li>เข้า console.firebase.google.com สร้างโปรเจกต์ฟรี</li><li>เปิด Firestore Database แบบ test mode</li><li>เพิ่ม Web app แล้วคัดลอก firebaseConfig มาวาง</li><li>ตั้งรหัสทริปที่เดายาก ใช้รหัสเดียวกันทั้งสองเครื่อง</li></ol>
    <label class="f" for="cfg">firebaseConfig</label><textarea class="in" id="cfg" rows="6">${fb.config ? esc(JSON.stringify(fb.config, null, 1)) : ''}</textarea>
    <label class="f" for="code">รหัสทริป</label><input class="in" id="code" value="${esc(fb.code || '')}" placeholder="เช่น seoul26-trib-saow-8842">
    <div class="note">ใช้ได้เมื่อเปิดจากลิงก์ของคุณเอง ในเดโมบน Claude จะซิงก์ผ่าน Claude แทน test mode ใช้ได้ 30 วัน พอดีทริป</div>
    <div class="btns" style="margin-top:18px"><button class="btn block green" id="save">เชื่อมต่อ</button>${fb.code ? '<button class="btn block" id="off">เลิกใช้ Firebase</button>' : ''}</div>`,
          (sh) => {
            sh.querySelector('#save').addEventListener('click', async () => {
              const body = val(sh, 'cfg')
                .replace(/^[^{]*/, '')
                .replace(/[^}]*$/, '')
              let cfg
              try {
                cfg = JSON.parse(body)
              } catch (e1) {
                try {
                  cfg = JSON.parse(
                    body
                      .replace(/'/g, '"')
                      .replace(/([{,]\s*)(\w+)\s*:/g, '$1"$2":')
                      .replace(/,\s*}/g, '}'),
                  )
                } catch (e2) {
                  toast('อ่าน config ไม่ได้')
                  return
                }
              }
              const code = val(sh, 'code')
                .trim()
                .replace(/[^\w\-]/g, '')
              if (!cfg.projectId || !code) {
                toast('ต้องมี projectId และรหัสทริป')
                return
              }
              LS.set('fb', { config: cfg, code })
              if (syncState.kind === 'claude') {
                closeSheet()
                toast('บันทึกแล้ว จะใช้เมื่อเปิดจากลิงก์ของคุณเอง')
                return
              }
              try {
                await startFirebase(cfg, code)
                closeSheet()
                toast('เชื่อมต่อ Firebase แล้ว')
              } catch (e) {
                toast('เชื่อมต่อไม่สำเร็จ')
              }
            })
            const o = sh.querySelector('#off')
            if (o)
              o.addEventListener('click', () => {
                LS.set('fb', null)
                location.reload()
              })
          },
        )
      }
      function restoreSheet() {
        openSheet(
          `<h3>นำเข้าข้อมูล</h3><div class="small muted">เลือกไฟล์จาก "สำรองข้อมูล"</div><input type="file" id="f" accept="application/json,.json" class="in" style="margin-top:12px">
    <div class="btns" style="margin-top:18px"><button class="btn block green" id="go">นำเข้า</button></div>`,
          (sh) => {
            sh.querySelector('#go').addEventListener('click', async () => {
              const file = sh.querySelector('#f').files[0]
              if (!file) {
                toast('เลือกไฟล์ก่อน')
                return
              }
              try {
                const data = JSON.parse(await file.text())
                let k = 0
                for (const c of COLS) {
                  for (const row of data[c] || []) {
                    const { id, ...rest } = row
                    if (id) {
                      await store.set(c, id, rest)
                      k++
                    }
                  }
                }
                closeSheet()
                toast(`นำเข้าแล้ว ${k} รายการ`)
              } catch (e) {
                toast('ไฟล์ไม่ถูกต้อง หรือพื้นที่ไม่พอ')
              }
            })
          },
        )
      }
      function backupJson() {
        const out = { app: 'seoul26', v: 2, at: new Date().toISOString() }
        COLS.forEach((c) => {
          out[c] =
            c === 'meta'
              ? [{ ...S.meta, id: 'settings' }]
              : Array.isArray(S[c])
                ? S[c]
                : Object.values(S[c])
        })
        saveFile('seoul26-backup.json', JSON.stringify(out), 'application/json')
      }
      function exportCsv() {
        const n = names(),
          q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"',
          items = planAll()
        const rows = [
          [
            'วัน',
            'รายการ',
            'แผน',
            'หมวด',
            'ใครจ่าย',
            'ส่วนของ ' + n.A,
            'ส่วนของ ' + n.B,
            'KRW',
            'THB',
            'จ่ายด้วย',
          ],
        ]
        ;[...S.expenses]
          .sort((a, b) => a.day - b.day || a.ts - b.ts)
          .forEach((e) => {
            const s = shares(e),
              it = items.find((p) => p.id === e.item)
            rows.push([
              e.day ? 'D' + e.day : 'ก่อนเดินทาง',
              e.title,
              it ? it.title : '',
              (CATS.find((c) => c.id === e.cat) || {}).name,
              n[e.payer],
              Math.round(s.A),
              Math.round(s.B),
              e.krw,
              Math.round((e.krw * rate()) / 1000),
              e.method,
            ])
          })
        saveFile(
          'seoul26-expenses.csv',
          '\ufeff' + rows.map((r) => r.map(q).join(',')).join('\n'),
          'text/csv',
        )
      }

      /* ================= EVENTS ================= */
      document.addEventListener('click', async (ev) => {
        const t = ev.target.closest('[data-tab],[data-act],[data-day],[data-sim],[data-goday]')
        if (!t) return
        if (t.closest('#sheet') && !t.dataset.act) return
        if (t.dataset.tab) {
          setTab(t.dataset.tab)
          return
        }
        if (t.dataset.goday) {
          planDay = Number(t.dataset.goday)
          LS.set('planDay', planDay)
          setTab('plan')
          return
        }
        if (t.dataset.day !== undefined && !t.dataset.act) {
          planDay = Number(t.dataset.day)
          LS.set('planDay', planDay)
          render()
          return
        }
        if (t.dataset.sim !== undefined && !t.dataset.act) {
          const s0 = SIMS.find((x) => x[0] === t.dataset.sim)
          setSim(s0 && s0[2] ? s0[2] : '')
          return
        }
        const a = t.dataset.act,
          id = t.dataset.id
        const items = () => planAll()
        if (a === 'addexp') expenseSheet(null, t.dataset.item)
        else if (a === 'editexp') expenseSheet(S.expenses.find((e) => e.id === id))
        else if (a === 'addpool') poolSheet()
        else if (a === 'delpool') {
          if (confirm('ลบรายการลงเงินนี้?')) await del('pool', id)
        } else if (a === 'wallet') walletSheet(t.dataset.w)
        else if (a === 'stop') stopSheet(id)
        else if (a === 'edititem') itemSheet(items().find((p) => p.id === id))
        else if (a === 'newitem') itemSheet(null, Number(t.dataset.day))
        else if (a === 'addphoto') {
          photoTarget = id
          $('#photoIn').click()
          if ($('#sheet').classList.contains('open')) closeSheet()
        } else if (a === 'quickdone') {
          const p = items().find((x) => x.id === id)
          if (
            await put('stops', id, {
              status: 'done',
              at: hmOf(now(), p.tz),
              by: me,
              ts: Date.now(),
            })
          )
            toast('เช็กอินแล้ว ' + hmOf(now(), p.tz))
        } else if (a === 'simstep') setSim(now() + Number(t.dataset.m) * 60e3)
        else if (a === 'simreset') setSim('')
        else if (a === 'gonow') {
          const el = document.querySelector('.it.now')
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' })
        } else if (a === 'nav') {
          const p = items().find((x) => x.id === id)
          const q = p.addr || p.q
          openSheet(
            `<h3>นำทางไป ${esc(p.title)}</h3>${p.addr ? `<div class="small muted">${esc(p.addr)}</div>` : ''}
      <div class="btns"><a class="btn block green" href="${naver(p.q || p.addr)}" target="_blank" rel="noopener">Naver Map (แนะนำในเกาหลี)</a><a class="btn block" href="${gmap(q)}" target="_blank" rel="noopener">Google Maps</a><a class="btn block" href="https://maps.apple.com/?q=${encodeURIComponent(q)}" target="_blank" rel="noopener">Apple Maps</a>
      ${p.phone ? `<a class="btn block" href="tel:${esc(p.phone.replace(/[^\d+]/g, ''))}">โทร ${esc(p.phone)}</a>` : ''}${p.url ? `<a class="btn block" href="${esc(p.url)}" target="_blank" rel="noopener">เว็บไซต์</a>` : ''}</div>
      <div class="note">ในเกาหลี Google Maps นำทางเดินและรถไม่ได้เต็มที่ ใช้ Naver Map จะแม่นกว่า</div>`,
            null,
            false,
          )
        } else if (a === 'more') {
          const p = items().find((x) => x.id === id)
          openSheet(
            `<h3>${esc(p.title)}</h3><div class="tiny">${p.t} ${p.tz === 'TH' ? 'เวลาไทย' : 'เวลาเกาหลี'}</div>
      <div class="btns"><button class="btn block green" data-act="addphoto" data-id="${p.id}">เพิ่มรูป</button><button class="btn block" data-act="cal1" data-id="${p.id}">ลงปฏิทิน</button><button class="btn block" data-act="edititem" data-id="${p.id}">แก้ไขรายการ</button></div>`,
            null,
            false,
          )
        } else if (a === 'viewphoto') photoView(id)
        else if (a === 'tick') {
          const c = S.checks[id] || {}
          if (c.done) await del('checks', id)
          else await put('checks', id, { done: true, by: me, ts: Date.now() })
        } else if (a === 'editcheck') checkSheet(checkAll().find((x) => x.id === id))
        else if (a === 'newcheck') checkSheet(null, t.dataset.g)
        else if (a === 'editinfo') infoSheet(infoAll().find((x) => x.id === id))
        else if (a === 'newinfo') infoSheet()
        else if (a === 'settings') settingsSheet()
        else if (a === 'rate') rateSheet()
        else if (a === 'firebase') firebaseSheet()
        else if (a === 'restore') restoreSheet()
        else if (a === 'backup') backupJson()
        else if (a === 'csv') exportCsv()
        else if (a === 'dlapp') saveFile('seoul26.html', PAGE_SOURCE, 'text/html')
        else if (a === 'calsheet')
          calSheet(t.dataset.day !== undefined ? Number(t.dataset.day) : null)
        else if (a === 'cal1') {
          const p = items().find((x) => x.id === id)
          openSheet(
            `<h3>${esc(p.title)}</h3><div class="small muted">${p.t} ${p.tz === 'TH' ? 'เวลาไทย' : 'เวลาเกาหลี'} แจ้งเตือนก่อน 30 นาที</div><div class="btns" style="margin-top:14px"><button class="btn block green" id="ics">ปฏิทิน iPhone (.ics)</button><a class="btn block" href="${gcal(p)}" target="_blank" rel="noopener">Google Calendar</a></div><div class="note">ปฏิทิน iPhone ต้องเปิดแอปนี้ใน Safari จากลิงก์ของตัวเอง ในแอป Claude ระบบไม่ยอมให้ส่งไฟล์เข้าปฏิทิน ถ้าใช้ในแอป Claude ให้พิมพ์บอก Claude ในแชตว่า "เพิ่มลงปฏิทิน iPhone" Claude เพิ่มให้ได้โดยตรง</div>`,
            (sh) =>
              sh
                .querySelector('#ics')
                .addEventListener('click', () =>
                  saveFile(p.id + '.ics', buildIcs([p]), 'text/calendar'),
                ),
            false,
          )
        } else if (a === 'copy') {
          try {
            await navigator.clipboard.writeText(t.dataset.v)
            toast('คัดลอกแล้ว')
          } catch (e) {
            toast(t.dataset.v)
          }
        } else if (a === 'theme') {
          const o = ['', 'light', 'dark']
          LS.set('theme', o[(o.indexOf(LS.get('theme', '')) + 1) % 3])
          applyTheme()
          render()
        } else if (a === 'resetplan') {
          if (confirm('ล้างการแก้ไขแผนทั้งหมด กลับไปใช้แผนเดิม?')) {
            for (const k of Object.keys(S.plan)) await del('plan', k)
            toast('คืนค่าแผนเดิมแล้ว')
          }
        } else if (a === 'bed' || a === 'wake') {
          const tt = now(),
            nd = nightDate(tt),
            key = sleepKey(nd, me),
            rec = { ...(S.sleep[key] || {}) }
          delete rec.id
          if (a === 'bed') {
            rec.bed = tt
            delete rec.wake
          } else {
            rec.wake = tt
            if (!rec.bed) rec.bed = null
          }
          if (await put('sleep', key, rec))
            toast(a === 'bed' ? 'ฝันดี บันทึกเวลาเข้านอนแล้ว' : 'อรุณสวัสดิ์ บันทึกเวลาตื่นแล้ว')
        }
      })
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeSheet()
      })
      document.addEventListener('change', (e) => {
        if (e.target.id === 'simdt' && e.target.value) {
          const [d, hm] = e.target.value.split('T')
          setSim(msAt(d, hm, 'KR'))
        }
      })
      function applyTheme() {
        const th = LS.get('theme', '')
        if (th) document.documentElement.setAttribute('data-theme', th)
        else document.documentElement.removeAttribute('data-theme')
      }

      /* ================= BOOT ================= */
      applyTheme()
      connect(LocalStore())
      render()
      setInterval(() => {
        renderTop()
        if (tab === 'today' && !$('#sheet').classList.contains('open')) render()
      }, 30000)
      ;(async () => {
        const fb = LS.get('fb', null)
        if (window.claude && typeof window.claude.use === 'function') {
          try {
            const [db, dl, user] = await Promise.all([
              window.claude.use('db'),
              window.claude.use('downloads'),
              window.claude.use('user'),
            ])
            downloadsCap = dl
            if (db) {
              connect(RemoteStore('claude', (c) => db.collection(c)))
              if (user) {
                try {
                  if ((await user.can('data.write')) === false) {
                    readOnly = true
                    renderTop()
                  }
                } catch (e) {}
              }
              return
            }
          } catch (e) {}
        }
        if (fb && fb.config && fb.code) {
          try {
            await startFirebase(fb.config, fb.code)
          } catch (e) {
            syncState.err = true
            renderTop()
            toast('เชื่อมต่อ Firebase ไม่สำเร็จ ใช้ข้อมูลในเครื่องไปก่อน')
          }
        }
      })()
    </script>
  </body>
</html>
