# Local services for development. Production uses Neon (see docs/INFRA.md).
name: iplan

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iplan
      POSTGRES_PASSWORD: iplan
      POSTGRES_DB: iplan
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iplan -d iplan']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
